<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mini App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <header class="top">
    <div class="user">
      <img id="avatar">
      <div>
        <div id="username">Player</div>
        <div class="lvl">Ур. 1</div>
      </div>
    </div>
    <div class="balance"><span id="balance">0</span> 💎</div>
  </header>

  <main id="view"></main>

  <nav class="bottom">
    <button data-tab="cases">🎰<span>Кейсы</span></button>
    <button data-tab="inventory">🎒<span>Инвентарь</span></button>
    <button data-tab="games">🎮<span>Игры</span></button>
    <button data-tab="profile">👤<span>Профиль</span></button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
