<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CASEVERSE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">CASEVERSE</div>
      <div class="balance">💎 <span id="balance">10 000</span></div>
    </header>

    <main class="screen active" id="screen-cases">
      <section class="hero">
        <h1>Открывай кейсы</h1>
        <p>Редкие предметы. Чистый стиль. CS2-вдохновение.</p>
      </section>

      <section class="cases-grid">
        <div class="case-card" data-case="classic">
          <div class="case-img"></div>
          <div class="case-info">
            <h3>Classic Case</h3>
            <span class="price">100 💎</span>
          </div>
        </div>
        <div class="case-card premium" data-case="premium">
          <div class="case-img"></div>
          <div class="case-info">
            <h3>Premium Case</h3>
            <span class="price">500 💎</span>
          </div>
        </div>
      </section>
    </main>

    <main class="screen" id="screen-open">
      <div class="roulette-wrapper">
        <div class="pointer"></div>
        <div id="roulette" class="roulette"></div>
      </div>
      <button id="spin">ОТКРЫТЬ</button>
      <div id="result"></div>
    </main>

    <main class="screen" id="screen-inventory">
      <h2>Инвентарь</h2>
      <div id="inventory" class="inventory-grid"></div>
    </main>

    <nav class="navbar">
      <button data-nav="screen-cases">Кейсы</button>
      <button data-nav="screen-inventory">Инвентарь</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
